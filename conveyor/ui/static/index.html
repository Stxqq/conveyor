<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>conveyor</title>
<meta name="description" content="A small pipeline engine for ML in plain Python. Watch a churn pipeline run: the DAG, the cache, retries, a failed validation and the model card it ships.">
<!-- conveyor ui rewrites this to "live"; the GitHub Pages copy replays recorded runs -->
<meta name="conveyor-source" content="recorded">
<meta property="og:type" content="website">
<meta property="og:title" content="conveyor">
<meta property="og:description" content="A small pipeline engine for ML: steps wired by name, a content-addressed cache, retries, lineage and a live run view.">
<meta property="og:url" content="https://stxqq.github.io/conveyor/">
<meta property="og:image" content="https://stxqq.github.io/conveyor/social.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="conveyor">
<meta name="twitter:description" content="A small pipeline engine for ML: steps wired by name, a content-addressed cache, retries, lineage and a live run view.">
<meta name="twitter:image" content="https://stxqq.github.io/conveyor/social.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff'/%3E%3Ccircle cx='8' cy='16' r='3' fill='%23111113'/%3E%3Ccircle cx='24' cy='9' r='3' fill='%23111113'/%3E%3Ccircle cx='24' cy='23' r='3' fill='%23111113'/%3E%3Cpath d='M11 15l10-5M11 17l10 5' stroke='%23111113' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="pill" aria-label="Views">
  <span class="pill-ind" aria-hidden="true"></span>
  <a class="pill-btn" href="#runs" data-view="runs">Runs</a>
  <a class="pill-btn" href="#graph" data-view="graph">Graph</a>
  <a class="pill-btn" href="#timeline" data-view="timeline">Timeline</a>
  <a class="pill-btn" href="#model" data-view="model">Model</a>
</nav>

<div id="page">
  <header class="intro">
    <p class="dear">conveyor</p>
    <p class="gray" id="lede">A small pipeline engine for ML in plain Python.</p>
  </header>

  <main class="stage" id="stage">
    <section class="view" data-view="runs" hidden></section>
    <section class="view" data-view="graph" hidden></section>
    <section class="view" data-view="timeline" hidden></section>
    <section class="view" data-view="model" hidden></section>
    <div class="caption" id="caption">
      <h2></h2>
      <p></p>
    </div>
  </main>

  <footer class="footer">
    <div class="f-block">
      <p class="f-label">Source</p>
      <a class="f-value" href="https://github.com/Stxqq/conveyor">github.com/Stxqq/conveyor</a>
    </div>
    <div class="f-block">
      <p class="f-label">License</p>
      <p class="f-value">MIT</p>
    </div>
    <div class="f-block">
      <p class="f-label">Built by</p>
      <p class="f-value">Stefan Carapic</p>
    </div>
  </footer>
</div>

<div class="transport" id="transport">
  <button class="t-play" type="button" aria-label="Play">
    <svg class="i-play" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3.5 2.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L4.4 1.7a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>
    <svg class="i-pause" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="8" y="2" width="3" height="10" rx="1" fill="currentColor"/></svg>
    <svg class="i-again" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M11.5 7a4.5 4.5 0 1 1-1.3-3.2M10.5 1.5v2.6H7.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="t-picker">
    <button class="t-run" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span class="t-run-dot"></span><span class="t-run-name"></span>
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.5 4l2.5 2.5L7.5 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="t-menu" role="listbox" aria-label="Runs"></div>
  </div>
  <div class="t-scrub" role="slider" tabindex="0" aria-label="Replay position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <span class="t-track"><span class="t-fill"></span></span>
    <span class="t-rail"><i class="t-thumb"></i></span>
  </div>
  <span class="t-time"></span>
  <span class="t-live" hidden><i></i>Live</span>
  <div class="t-speed" role="group" aria-label="Replay speed"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  <button class="sheet-close" type="button" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
